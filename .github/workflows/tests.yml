
name: Tests Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install flask unittest-xml-reporting

      - name: Executer les tests et generer le rapport XML
        run: |
          python -m xmlrunner discover -s . -p "test_student_manager.py" -o test-reports

      - name: Publier le rapport XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-xml
          path: test-reports/
